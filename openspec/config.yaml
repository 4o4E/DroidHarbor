schema: spec-driven

context: |
  Language: zh-CN
  All artifacts must be written in zh-CN.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  项目为 DroidHarbor，服务于约 3 台起步、最多约 10 台 Android 手机的 AI 设备池。
  首版同时支持手机通过 USB 或 Wi-Fi ADB 接入平台，以及调用方连接平台提供的远程 ADB 入口。
  当前阶段为 build-droidharbor-v1 实施；用户已授权工程开发并明确批准 design.md 第 9 节 SQLite schema，可编写和执行对应迁移。UI 原型可制作，实际布局须经用户评审后进入正式页面实现。
  项目规划入口：docs/项目规划.md；原始业务需求：ref/需求&选型.md。
  用户已使用 WebAppFlaskscrcpy 并确认不适用，独立重写，不安排参考项目试用、不复制其应用代码。
  已确认后端及任务级辅助 CLI 使用 Go，浏览器投屏使用 Pion WebRTC；手机编码、服务端转发、浏览器解码。
  已确认单 Go 服务统一提供静态前端、API、租约网关与投屏；管理员使用访问令牌登录，不采用账号密码或 SSO。
  Go/Pion 和业务依赖的具体版本在实施时依据上游支持状态锁定。
  已确认 SQLite、Windows 原生及 Linux Docker 服务端、内网/VPN 访问；正式支持桌面 Chrome/Edge 与 Android Chrome。
  Linux 使用 Docker Compose 分别部署平台与 ADB，ADB 容器负责 USB/Wi-Fi 接入；平台更新不要求重启 ADB，原始管理端口不暴露给调用方。
  API/ADB 协议和部署按 design.md 实施；版本矩阵以实际运行证据补齐，性能先测量再定数值门槛。
  用户明确表示稍后提供测试机；不得连接或操作未经指定的局域网设备，真机验收保持未完成，不缩小首版范围。
  前端遵循 .omp/skills/frontend-library/SKILL.md，复用成熟组件，不复刻参考项目 UI。
  网页操作语义对齐 scrcpy；明确浏览器快捷键、剪贴板和焦点限制，不将桌面全部功能自动纳入首版。
  首版功能包含设备池、Skill/CLI、网页投屏控制、截图、剪贴板、APK 安装和文件传输；不含音频、录屏、群控、应用仓库、MCP 或完整权限管理后台。
  人工入口统一网页，不保留 eScrcpy 产品入口，不承担共存兼容或验收，也不擅自修改已有软件。
  网页分辨率、帧率上限、目标码率独立可调；保持手机画面比例，默认长边上限 1920、30 fps、4 Mbps，不降低 ADB 原生截图分辨率。
  同设备所有网页观看者共享视频采集及画质配置；调整不改变 AI 租约，生效尺寸/参数及切换状态明确，不为各观看者独立编码或做服务端视频转码。
  设备池卡片整体点击打开工作台，管理入口独立；工作台左侧带预览列表用于直接切换设备，不使用下拉框。切换释放本窗口旧输入并清除旧帧，不改变其他窗口或 AI 租约，不隐式提升只读权限。
  设备池和工作台左侧列表采用共享低频截图，默认每 5 秒更新可见设备；服务端按需生成小图并共享有界缓存，隐藏停止请求，失败不伪装实时画面，不降低原始截图分辨率。
  独立小窗只显示打开时选定手机的画面和底部一排按钮，不放设备信息、切换列表或可展开面板。只用浏览器 window.open popup，允许移动和手动缩放，底部可一键调整窗口尺寸；实际尺寸与浏览器限制如实反馈，不增加桌面客户端、外框锁定、Document PiP 或强制置顶。
  已确认交付操作 Skill 与按任务启动的辅助 CLI：CLI 建立认证加密通道，原生 adb 连接其 loopback 入口。
  调用方支持 Windows/Linux，不限制 harness；使用标准 CLI、退出码与机器可读结果，不依赖专用插件或结束钩子。
  CLI 使用任务专用本地 ADB Server 与配置，只清理自身资源；不做全局守护服务、不自动升级、换设备或重放操作。
  产品操作 Skill 与 frontend-library/OpenSpec 开发 skills 不同；必须配合可运行产品 CLI 交付，不创建占位 Skill。
  管理 API 负责租约和连接描述，AI 设备操作走租约 ADB 网关，不重复建设一套纯 HTTP AI 操作接口。
  Appium、uiautomator2 仅预留扩展合同，当前不部署、不实现、不承诺兼容。
  AI 租约绑定任务身份，按标签原子认领；ADB transport、子流和重连均受服务端约束，不能直接暴露服务端 ADB Server。
  已确认固定 15 分钟显式续租：初次认领及每次续租的 expiresAt = 服务端当前时间 + 15 分钟，不叠加时间。
  任务累计时长与续租次数不限，完成后显式释放；CLI 不自行续租，不实现自动续租窗口，长操作期间也需主动续租。
  CLI 存活、连接保活和 ADB 流量不延长授权；无流量也不提前释放有效租约；过期租约不得复活。
  服务重启后全部旧租约失效，先撤销旧访问、回收平台资源再开放分配，不恢复原剩余租期。
  回收仅处理平台拥有的任务连接、转发、会话等资源，完成且连接健康后回池；清理失败或旧访问状态不明才隔离。
  保留用户应用、账号、文件及后台状态，不清数据、不主动终止用户后台程序，不以后台任务全部结束作为回池条件。
  设备后台程序可继续产生副作用，这是已确认的保留状态策略；不同端口/进程不等于操作系统或设备执行环境隔离。
  人工入口与 AI 租约独立；不得默认人工接管会暂停 AI、释放租约或改变手机账号环境。
rules:
  proposal:
    - 区分已确认需求、建议方案和未知条件；明确首版范围与不做的功能。
    - 涉及架构选择或数据库 schema 的实施必须先取得用户确认。
  design:
    - 说明原生 ADB 认证、租约失效、旧连接与端口复用、后台进程、重启恢复、双容器生命周期及网页共享采集的资源归属。
    - 先取得真实性能数据，再确认数值门槛；不能把换语言或带宽算术当作性能证明。
    - 兼容接口只保留实际需求边界，不预建插件系统、微服务或备用实现。
  specs:
    - 为固定 15 分钟且不限累计时长、显式续租与过期竞态、重启旧租约失效、标签并发认领、旧连接撤销、USB/Wi-Fi 去重、平台资源回收失败及保留应用状态定义场景。
    - 为分辨率/帧率/码率独立调整、保持画面比例、同设备网页共享配置、参数切换和坐标映射定义场景。
  tasks:
    - 未确认的架构或业务决策作为实施门槛，不自动替用户选择。
    - 分别验收 Windows 原生/Linux Docker 的 USB/Wi-Fi、持久化及重启恢复；验收内网/VPN、桌面 Chrome/Edge、Android Chrome 和 Windows/Linux 通用 CLI，不依赖 harness 专用集成。
