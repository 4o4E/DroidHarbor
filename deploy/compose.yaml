name: droidharbor

services:
  platform:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: deploy/Dockerfile.platform
    image: droidharbor-platform:latest
    init: true
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 45s
    depends_on:
      - adb
    command: [serve, --env-file, /run/droidharbor-config/.env]
    environment:
      DROIDHARBOR_DATABASE: /var/lib/droidharbor/droidharbor.db
      DROIDHARBOR_ADMIN_FILE: /run/droidharbor-config/admin.json
      DROIDHARBOR_LISTEN: 0.0.0.0:8080
      DROIDHARBOR_ADB_SERVER: adb:5037
      DROIDHARBOR_RTC_LISTEN: 0.0.0.0:${DH_RTC_PORT:?set shared UDP port}
      DROIDHARBOR_RTC_ADVERTISED_IP: ${DH_RTC_ADVERTISED_IP:?set browser-reachable IPv4}
      DROIDHARBOR_TRANSFER_TEMP_DIR: /var/lib/droidharbor/transfers
      DROIDHARBOR_LOG_FILE: /var/lib/droidharbor/logs/platform.jsonl
    volumes:
      - type: bind
        source: ${DH_PLATFORM_DATA:?set platform state directory}
        target: /var/lib/droidharbor
      - type: bind
        source: ${DH_CONFIG_DIR:?set admin and dotenv config directory}
        target: /run/droidharbor-config
        read_only: true
    ports:
      - "${DH_HTTP_BIND_ADDRESS:?set local HTTP bind IPv4}:${DH_HTTP_PORT:?set HTTP host port}:8080/tcp"
      - "${DH_RTC_BIND_ADDRESS:?set local UDP bind IPv4}:${DH_RTC_PORT:?set UDP host port}:${DH_RTC_PORT:?set UDP host port}/udp"
    networks:
      - backend

  adb:
    platform: linux/amd64
    build:
      context: ./adb
      dockerfile: Dockerfile
    image: droidharbor-adb:latest
    user: "0:0"
    init: true
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    device_cgroup_rules:
      - "c 189:* rmw"
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ${DH_ADB_AUTH_DIR:?set separate ADB authorization directory}
        target: /root/.android
      - type: bind
        source: /dev/bus/usb
        target: /dev/bus/usb
    expose:
      - "5037/tcp"
    networks:
      - backend

networks:
  backend:
    driver: bridge
