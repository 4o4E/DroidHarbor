schema: spec-driven

context: |
  Language: zh-CN
  All artifacts must be written in zh-CN.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  DroidHarbor 为单宿主 Android 真机设备池；AI 使用任务级 Skill/Go CLI 与原生 ADB，人工使用桌面网页。
  架构设计：docs/架构设计.md；已确认决策：docs/架构决策.md；原始需求：ref/需求&选型.md。
  实施合同为 build-droidharbor-v1 及 device-preview-audio-settings 的 design/specs；逐项状态以对应 tasks 为准，不把试用包视为完整矩阵完成。
  API 以 api/openapi.yaml、客户端使用以 skills/droidharbor/SKILL.md、部署用法以 deploy/ 为准。
  开发规则读 AGENTS.md；工作区存在 AGENTS.local.md 时同时读取。只新增或改变架构/schema/业务选择时确认，既定决策直接执行。
rules:
  proposal:
    - 区分已确认需求、建议方案和未知条件；明确首版范围与不做的功能。
    - 涉及架构选择或数据库 schema 的实施必须先取得用户确认。
  design:
    - 说明原生 ADB 认证、租约失效、旧连接与端口复用、后台进程、重启恢复、双容器生命周期及网页共享采集的资源归属。
    - 先取得真实性能数据，再确认数值门槛；不能把换语言或带宽算术当作性能证明。
    - 兼容接口只保留实际需求边界，不预建插件系统、微服务或备用实现。
  specs:
    - 为固定 15 分钟且不限累计时长、显式续租与过期竞态、重启旧租约失效、标签并发认领、旧连接撤销、USB/Wi-Fi 去重、平台资源回收失败及保留应用状态定义场景。
    - 为后端分辨率/帧率/码率独立调整、网页帧率/码率档位、保持比例、共享配置、参数切换和旋转后坐标映射定义场景。
  tasks:
    - 未确认的架构或业务决策作为实施门槛，不自动替用户选择。
    - 分别验收 Windows 原生/Linux Docker 的 USB/Wi-Fi、持久化及重启恢复；验收内网/VPN、桌面 Chrome/Edge 和 Windows/Linux 通用 CLI，不依赖 harness 专用集成。
