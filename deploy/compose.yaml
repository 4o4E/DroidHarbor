name: droidharbor

services:
  platform:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: deploy/Dockerfile.platform
    image: droidharbor-platform:${DH_IMAGE_TAG:?set immutable release/build tag}
    init: true
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 45s
    depends_on:
      - adb
    command:
      - serve
      - --database
      - /var/lib/droidharbor/droidharbor.db
      - --admin-file
      - /run/droidharbor-config/admin.json
      - --listen
      - 0.0.0.0:8443
      - --origin
      - ${DH_HTTPS_ORIGIN:?set external HTTPS origin}
      - --tls-cert
      - /run/droidharbor-config/tls.crt
      - --tls-key
      - /run/droidharbor-config/tls.key
      - --web-dir
      - /opt/droidharbor/web
      - --adb-server
      - adb:5037
      - --scrcpy-server
      - /opt/droidharbor/scrcpy-server-v5.0.1
      - --rtc-listen
      - 0.0.0.0:${DH_RTC_PORT:?set shared UDP port}
      - --rtc-advertised-ip
      - ${DH_RTC_ADVERTISED_IP:?set browser-reachable VPN IPv4}
      - --transfer-temp-dir
      - /var/lib/droidharbor/transfers
    volumes:
      - type: bind
        source: ${DH_PLATFORM_DATA:?set platform state directory}
        target: /var/lib/droidharbor
      - type: bind
        source: ${DH_CONFIG_DIR:?set admin and TLS config directory}
        target: /run/droidharbor-config
        read_only: true
    ports:
      - "${DH_HTTPS_BIND_ADDRESS:?set local HTTPS bind IPv4}:${DH_HTTPS_PORT:?set HTTPS host port}:8443/tcp"
      - "${DH_RTC_BIND_ADDRESS:?set local UDP bind IPv4}:${DH_RTC_PORT:?set UDP host port}:${DH_RTC_PORT:?set UDP host port}/udp"
    networks:
      - backend

  adb:
    platform: linux/amd64
    build:
      context: ./adb
      dockerfile: Dockerfile
    image: droidharbor-adb:platform-tools-37.0.1-15733141
    user: "0:0"
    init: true
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    device_cgroup_rules:
      - "c 189:* rmw"
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ${DH_ADB_AUTH_DIR:?set separate ADB authorization directory}
        target: /root/.android
      - type: bind
        source: /dev/bus/usb
        target: /dev/bus/usb
    expose:
      - "5037/tcp"
    networks:
      - backend

networks:
  backend:
    driver: bridge
