schema: spec-driven

context: |
  Language: zh-CN
  All artifacts must be written in zh-CN.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  项目为 DroidHarbor，服务于约 3 台起步、最多约 10 台 Android 手机的 AI 设备池。
  首版同时支持手机通过 USB 或 Wi-Fi ADB 接入平台，以及调用方连接平台提供的远程 ADB 入口。
  当前阶段为 build-droidharbor-v1 实施及 device-preview-audio-settings 改造；用户已授权工程开发并明确批准 design.md 第 9 节 SQLite schema、本轮 schema 4 及增强上限 schema 5 增量迁移。UI 直接修改现有设备池、工作台和组件，保留现有主题与交互体系，不制作独立示例原型，不设原型评审门槛。
  项目规划入口：docs/项目规划.md；原始业务需求：ref/需求&选型.md。
  用户已使用 WebAppFlaskscrcpy 并确认不适用，独立重写，不安排参考项目试用、不复制其应用代码。
  已确认后端及任务级辅助 CLI 使用 Go，浏览器投屏使用 Pion WebRTC；手机编码、服务端转发、浏览器解码。
  已确认单 Go 服务统一提供静态前端、API、租约网关与投屏；管理员使用访问令牌登录，不采用账号密码或 SSO。
  Go/Pion 和业务依赖的具体版本在实施时依据上游支持状态锁定。
  已确认 SQLite、Windows 原生及 Linux Docker 服务端、内网/VPN 访问；网页仅面向桌面 Chrome/Edge，不考虑移动端。
  Linux 使用 Docker Compose 分别部署平台与 ADB，ADB 容器负责 USB/Wi-Fi 接入；平台更新不要求重启 ADB，原始管理端口不暴露给调用方。
  API/ADB 协议和部署按 design.md 实施；版本矩阵以实际运行证据补齐，性能先测量再定数值门槛。
  已按用户三机轮换场景使用小米平板 5（Android 16）、一加 9R（Android 13）及 USB CPH2609（Android 14）验收；同机 USB/Wi-Fi 链路不重复计数。仅操作指定设备，USB 热插拔、拒绝授权及完整部署/浏览器矩阵仍需专项验证。
  前端遵循 .omp/skills/frontend-library/SKILL.md，复用成熟组件，不复刻参考项目 UI。
  网页操作语义对齐 scrcpy；明确浏览器快捷键、剪贴板和焦点限制，不将桌面全部功能自动纳入首版。
  首版功能包含设备池、Skill/CLI、网页投屏控制、截图、剪贴板及独立设备媒体音频路由；APK 和文件传输保留后端/原生 ADB 能力，网页移除文件入口。不含麦克风、录屏、群控、应用仓库、MCP 或完整权限管理后台。
  人工入口统一网页，不保留 eScrcpy 产品入口，不承担共存兼容或验收，也不擅自修改已有软件。
  网页帧率和码率为全局目标，默认 60 fps/12 Mbps，提供既有下拉档位；保留设备长边策略及真实比例。保存不打断现有共享采集，含十五秒保留流；该设备下次新建采集时使用最新目标。schema 3 由启动自动迁移，保存全局配置与设备最近成功档位缓存，移除独立设备帧率/码率设置，保留设备身份、标签、链路和屏幕信息。
  同设备所有网页观看者共享视频采集；明确编码配置不支持时，优先回退到最近成功且不超过目标的参数，无记录使用 30 fps/4 Mbps。仅有效视频帧证明回退成功；统一通知显示设备、目标/实际参数与原因，全部失败明确报错，不修改全局目标或 AI 租约，不对 ADB、网络或权限故障降档。
  设备池卡片左侧手机画面、右侧名称状态及操作；仅画面及“预览”按钮进入工作台，名称和卡片空白不导航，管理入口独立。离线卡片提供刷新并尝试已保存的无线连接地址，不重新配对或恢复旧 AI 任务。工作台左侧设备列表整卡点击直接切换预览，小窗按钮独立；没有有效选择时按在线优先列表自动预览第一台，已有选择保留，空列表显示空态。
  设备池可见设备默认每 5 秒共享截图；工作台仅从当前视频取帧更新预览，切走前保存最新帧，后台冻结且不轮询截图，失败保留同链路旧图并统一通知。
  设备池和工作台逐设备卡片右上角提供独立小窗图标，同源 SharedWorker 协调同一浏览器唯一窗口，原生具名 popup 只用于实际创建；关闭主页面不影响小窗。倍率按视频原始像素，默认有序 0.5/1/2，系统设置可增补；左键循环、右键菜单，超桌面完整适配并通知，保留手动缩放，不增加桌面客户端或强制置顶。
  已确认交付一个客户端 Skill ZIP，内含 Windows/Linux amd64 辅助 CLI；服务端交付一个内嵌网页与采集程序的 Windows EXE。CLI 建立经任务认证的通道，原生 adb 连接其 loopback 入口。
  调用方支持 Windows/Linux，不限制 harness；使用标准 CLI、退出码与机器可读结果，不依赖专用插件或结束钩子。
  CLI 使用任务专用本地 ADB Server 与配置，只清理自身资源；不做全局守护服务、不自动升级、换设备或重放操作。
  产品操作 Skill 与 frontend-library/OpenSpec 开发 skills 不同；必须配合可运行产品 CLI 交付，不创建占位 Skill。
  管理 API 负责租约和连接描述，AI 设备操作走租约 ADB 网关，不重复建设一套纯 HTTP AI 操作接口。
  Appium、uiautomator2 仅预留扩展合同，当前不部署、不实现、不承诺兼容。
  AI 租约绑定任务身份，按标签原子认领；ADB transport、子流和重连均受服务端约束，不能直接暴露服务端 ADB Server。
  已确认固定 15 分钟显式续租：初次认领及每次续租的 expiresAt = 服务端当前时间 + 15 分钟，不叠加时间。
  任务累计时长与续租次数不限，完成后显式释放；CLI 不自行续租，不实现自动续租窗口，长操作期间也需主动续租。
  CLI 存活、连接保活和 ADB 流量不延长授权；无流量也不提前释放有效租约；过期租约不得复活。
  服务重启后全部旧租约失效，先撤销旧访问、回收平台资源再开放分配，不恢复原剩余租期。
  回收仅处理平台拥有的任务连接、转发、会话等资源，完成且连接健康后回池；清理失败或旧访问状态不明才隔离。
  保留用户应用、账号、文件及后台状态，不清数据、不主动终止用户后台程序，不以后台任务全部结束作为回池条件。
  设备后台程序可继续产生副作用，这是已确认的保留状态策略；不同端口/进程不等于操作系统或设备执行环境隔离。
  人工入口与 AI 租约独立；不得默认人工接管会暂停 AI、释放租约或改变手机账号环境。
  已确认 B 档显示预布局与切换加速：批准 schema 2 保存设备屏幕及实际视频几何，接入核验/旧设备上线采集。每个已访问设备独立保留完整视频链 15 秒，回到设备取消倒计时，下次离开重新计时；均计入 64 个媒体会话容量，不预热未访问设备。退出/撤权/断连立即回收，复用校验后的设备端 JAR。
  已确认区分物理旋转和网页旋转：手机操作切换横竖屏并尊重应用/系统策略；网页提供左转、右转各 90 度，不改变手机。主工作台及小窗的返回、Home、最近任务位于贴屏操作栏底部，音频菜单紧邻其上方，其余操作位于顶部。
  设备管理保留名称、标签、AI 分配及删除；配对连接信息只在新增时输入。默认不可分配，AI 占用关闭或删除须确认当前任务代次；删除结束平台访问并严格回收自有资源后移除，保留历史和手机数据，回收失败保留可管理记录。schema 4 自动增加 removed_at 和系统偏好，显式重新添加核验后保留原身份与 generation。
  已确认当前工作台及独立小窗的视频瞬时故障自动恢复；仅当前目标逐步退避重建，离线等待重新核验在线，切走/关闭停止恢复。健康后台流仍独立保留十五秒；恢复不重放输入、不改画质或 AI 租约，登录失效及未确认资源回收不强行重启。
  已确认已登记设备上线即初始化运行状态、封面及基本指标，不等待页面选中。在线期间持续逻辑唤醒、实体黑屏，关闭网页仍保持，平台停止/设备断开/移除后结束；复用无音视频编码的 scrcpy 控制模式，不改变系统休眠或密码配置。卡片展示整机 CPU、内存已用/总量、电池温度和电量，真实充电中使用绿色充电图标，其余状态灰色；共享五秒采样，仅运行时缓存，无历史库或 schema 变更。
  运行日志使用固定 pattern：UTC+8 的 yyyy-MM-dd HH:mm:ss.SSS、级别、前八位设备 ID、msg 与按序诊断值；不输出 label=value，完整设备身份不变，保留关联信息和安全原因。AI CLI 可列出设备摘要，按完整设备 ID 或精确名称领用，同名返回歧义，不可用不换机，标签条件仍须全部满足。
  系统设置集中全局画质、媒体音频默认值、网页增强上限及倍率；独立偏好 revision 不改变画质版本。音频默认静音，可选设备/网页播放，主预览与小窗左侧竖栏三个基础按钮上方快捷切换。主音量条放在输出按钮上方，网页模式调本地 0–100%，设备模式调手机真实媒体音量，静音禁用，移除顶部音量加减。悬浮主音量区域显示额外网页增强条，默认 1.0、范围 0.0–3.0；上限全局可改且至少 1.0，下调导致当前增强降低时明确通知。schema 5 仅新增 audio_gain_max，保留原数据和设置；临时音量与增强不存库。设备临时路由沿用十五秒保留，最后视频流真正关闭后重置；scrcpy-audio 独立采集 Opus，不重建视频，路由切换不自动改手机音量，手动设备音量只修改 STREAM_MUSIC；铃声/闹钟/通知保持手机设置。网页经平滑 GainNode 处理，仅选定可见前台窗口播音，拒播、读写失败和清理异常明确通知。
  网页键盘 NumLock 状态映射为 Android META_NUM_LOCK_ON，小键盘 0–9 的按下和抬起均携带；用户只要求 NumLock 开启时正常输入数字，关闭时沿用既有路径，不增加导航转换。
rules:
  proposal:
    - 区分已确认需求、建议方案和未知条件；明确首版范围与不做的功能。
    - 涉及架构选择或数据库 schema 的实施必须先取得用户确认。
  design:
    - 说明原生 ADB 认证、租约失效、旧连接与端口复用、后台进程、重启恢复、双容器生命周期及网页共享采集的资源归属。
    - 先取得真实性能数据，再确认数值门槛；不能把换语言或带宽算术当作性能证明。
    - 兼容接口只保留实际需求边界，不预建插件系统、微服务或备用实现。
  specs:
    - 为固定 15 分钟且不限累计时长、显式续租与过期竞态、重启旧租约失效、标签并发认领、旧连接撤销、USB/Wi-Fi 去重、平台资源回收失败及保留应用状态定义场景。
    - 为后端分辨率/帧率/码率独立调整、网页帧率/码率档位、保持比例、共享配置、参数切换和旋转后坐标映射定义场景。
  tasks:
    - 未确认的架构或业务决策作为实施门槛，不自动替用户选择。
    - 分别验收 Windows 原生/Linux Docker 的 USB/Wi-Fi、持久化及重启恢复；验收内网/VPN、桌面 Chrome/Edge 和 Windows/Linux 通用 CLI，不依赖 harness 专用集成。
